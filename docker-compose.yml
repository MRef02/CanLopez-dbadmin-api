version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examen
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: logiexpress
    ports:
      - "3310:3306"
    volumes:
      - examen_data:/var/lib/mysql

volumes:
  examen_data:
